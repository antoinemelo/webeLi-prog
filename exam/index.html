<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription enseignants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../assets/css/dist/bootstrap@5.3.8/bootstrap_min.css">
  <link rel="stylesheet" href="../assets/css/dist/bootstrap-icons@1.13.1/bootstrap-icons_min.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #joinFrame { width: 100%; height: 100vh; border: none; display: none; }
  </style>
</head>
<body class="bg-light">
  <div id="formContainer" class="container py-5">
    <h1><a href="../" style="text-decoration:none;"><i class="bi bi-mortarboard"></i></a> Inscription enseignants</h1>
    <p class="text-muted">Veuillez entrer le code de votre établissement :</p>
    <form id="schoolForm" class="row g-3">
      <div class="col-md-4">
        <input type="text" class="form-control" id="schoolInput"
               maxlength="4" placeholder="Code" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle"></i> Valider
        </button>
      </div>
    </form>
  </div>

  <iframe id="joinFrame"></iframe>

<script>
window.onload = function () {
  const params = new URLSearchParams(window.location.search);
  const school = params.get("school");

  if (school) {
    // Cache le formulaire et montre l'iframe
    document.getElementById("formContainer").style.display = "none";
    const frame = document.getElementById("joinFrame");
    frame.style.display = "block";
    frame.src =
      "https://parapente.world/lab/api/exam/join.php?school=" +
      encodeURIComponent(school);
  }

  // ✅ Gestion du formulaire toujours active
  document.getElementById("schoolForm").onsubmit = function (e) {
    e.preventDefault();
    const code = document.getElementById("schoolInput").value.trim().toUpperCase();
    if (code.length === 4) {
      window.location.href = "?school=" + encodeURIComponent(code);
    } else {
      alert("Le code est incorrect.");
    }
  };
};

window.addEventListener("message", (event) => {
  if (
    event.origin === "https://parapente.world" &&
    event.data &&
    event.data.action === "logout"
  ) {
    // Cacher l’iframe
    const frame = document.getElementById("joinFrame");
    frame.src = "";
    frame.style.display = "none";

    // Réafficher le formulaire
    document.getElementById("formContainer").style.display = "block";

    // Nettoyer l’URL
    window.history.pushState({}, document.title, window.location.pathname);
  }
});

</script>


</body>
</html>
