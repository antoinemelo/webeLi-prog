<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Lexique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Lexique complet des notions d'informatique classées par thématiques, chapitres et sous-chapitres." />
  <meta name="theme-color" content="#0b1220" />

  <!-- Favicon -->
  <link rel="icon" href="../images/grid.svg" type="image/svg+xml">
  <link rel="icon" href="../images/grid.ico" sizes="any">

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="../css/dist/bootstrap@5.3.8/bootstrap_min.css">
  <link rel="stylesheet" href="../css/dist/bootstrap-icons@1.13.1/bootstrap-icons_min.css">
  <link rel="stylesheet" href="../css/app.css">

  <!-- SQL.js -->
  <script src="../js/dist/sql-js@1.13.0/sql-wasm.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { position: relative; }

    /* Sidebar */
    .sidebar { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; }
    .card-header, .list-group-item { background: var(--surface-1); color: var(--text-main); }

    /* Typographie titres */
    h1 { margin-bottom: 2rem; font-weight: 700; text-transform: uppercase; }
    h2 { margin-top: 3rem; margin-bottom: 1rem; font-weight: 600; text-transform: uppercase;
         border-bottom: 2px solid var(--border); padding-bottom: .4rem; }
    h3 { margin-top: 2rem; margin-bottom: .75rem; font-weight: 600; color: var(--text-main); }
    h4 { margin-top: 1.5rem; font-weight: 500; color: var(--text-muted); }
	h2:first-of-type {
	  margin-top: 0;
	}

	#toc .list-group-item {
	  text-transform: uppercase;
	}

	/* Termes */
	.term {
	  display: flex;
	  align-items: flex-start;
	  justify-content: space-between;
	  gap: .5rem;
	  margin-bottom: .5rem;
	  flex-wrap: nowrap;
	}

	.term .explication {
	  flex: 1 1 25%;
	  color: var(--text-main);
	  white-space: pre-wrap;
	  font-size: 1em;
	  line-height: 1.4;
	}

	.term .exemple {
	  flex: 1 1 70%;
	  max-width: 70%;
	  color: var(--text-muted);
	  opacity: .9;
	  font-family: ui-monospace, monospace;
	  font-size: .85em;
	  white-space: pre-wrap;
	  line-height: 1.1;
	}

	.back-top-fixed {
	  position: fixed;
	  bottom: 1.5rem;
	  right: 1.5rem;
	  z-index: 1030;
	  display: none; /* caché par défaut */
	  width: 3rem;
	  height: 3rem;
	  border-radius: 50%;
	  background: color-mix(in oklab, var(--text-main) 8%, transparent);
	  color: var(--text-main);
	  border: 1px solid var(--border);
	  box-shadow: var(--shadow);
	  align-items: center;
	  justify-content: center;
	  text-decoration: none;
	}

	.back-top-fixed.show {
	  display: inline-flex; /* devient visible */
	}

	.back-top-fixed:hover {
	  background: color-mix(in oklab, var(--text-main) 12%, transparent);
	}

	@media print {
	  body {
		font-size: 11pt;
		line-height: 1.3;
	  }

	  /* Garder explication + exemple sur la même ligne */
	  .term {
		display: table;
		width: 100%;
	  }
	  .term .explication,
	  .term .exemple {
		display: table-cell;
		vertical-align: top;
		padding-right: .5rem;
		font-size: 10pt;
	  }

	  /* Optionnel : éviter que ça se coupe en plein milieu */
	  .term { page-break-inside: avoid; }
	}

	/* Responsive : en-dessous de 768px → vertical */
	@media (max-width: 768px) {
	  .term {
		flex-direction: column;
		align-items: flex-start;
	  }
	  .term .explication,
	  .term .exemple {
		flex: 1 1 100%;
		max-width: 100%;
	  }
	  .term .exemple {
		margin-top: .25rem;
	  }
	}

  </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#toc" data-bs-offset="100" tabindex="0">

  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../../">
        <i class="bi bi-journal-text"></i>
        <span>INFORMATIC – Lexique</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="topnav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="../../labs/">Guide utilisateur</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-outline-light btn-sm btn-print" href="#" onclick="window.print()">
              <i class="bi bi-printer"></i> Imprimer / PDF
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- Contenu -->
  <main class="container my-4">
    <div class="row g-4">
      <!-- Sommaire -->
      <aside class="col-12 col-lg-3">
        <div class="sidebar">
          <div class="card">
            <div class="card-header d-flex align-items-center gap-2">
              <i class="bi bi-list-check"></i><span>Thématiques</span>
            </div>
            <div class="list-group list-group-flush" id="toc"></div>
          </div>
        </div>
      </aside>

      <!-- Lexique -->
      <section class="col-12 col-lg-9" id="lexiqueContent">
        <h1>Lexique complet</h1>
        <p class="text-secondary">Navigation : choisissez une thématique dans le menu de gauche.</p>
      </section>
    </div>
  </main>

	<a href="#" class="back-top-fixed" id="backTopBtn" title="Retour en haut">
	  <i class="bi bi-arrow-up"></i>
	</a>
	
<script>
let db;

async function init() {
  const SQL = await initSqlJs({
    locateFile: f => `../js/dist/sql-js@1.13.0/${f}`
  });

  try {
    const response = await fetch("aide.db", { cache: "no-store" });

    // Debug utile : si 404 / 403 / etc.
    if (!response.ok) {
      throw new Error(`HTTP ${response.status} en chargeant aide.db`);
    }

    const buffer = await response.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buffer));
    renderLexique();
  } catch (err) {
    console.error("Init error:", err);
    document.getElementById("lexiqueContent").innerHTML =
      `<p class="text-danger">Erreur de chargement de la base : ${escapeHtml(err.message || String(err))}</p>`;
  }
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* =========================
   ✅ FONCTIONS MANQUANTES
   ========================= */

function nlToBrExceptQuoted(input) {
  if (input === null || input === undefined) return "";

  let s = String(input);

  // Protéger le cas exact : "\n
  const TOKEN = "__QUOTED_LIT_NL__";
  s = s.replace(/"\\n/g, `"${TOKEN}`);

  // \n littéraux -> <br>
  s = s.replace(/\\n/g, "<br>");

  // vrais retours ligne -> <br>
  s = s.replace(/\r\n|\r|\n/g, "<br>");

  // restaurer "\n
  s = s.replace(new RegExp(`"${TOKEN}`, "g"), `"\\n`);

  return s;
}

function normalizeCodeTextExceptQuoted(input) {
  if (input === null || input === undefined) return "";

  let s = String(input);

  // Protéger "\n (dans une chaîne)
  const TOKEN = "__QUOTED_LIT_NL__";
  s = s.replace(/"\\n/g, `"${TOKEN}`);

  // \n littéraux -> vrais retours (pour affichage code)
  s = s.replace(/\\n/g, "\n");

  // normaliser retours Windows
  s = s.replace(/\r\n|\r/g, "\n");

  // tabulations
  s = s.replace(/\\t/g, "    ").replace(/\t/g, "    ");

  // restaurer "\n
  s = s.replace(new RegExp(`"${TOKEN}`, "g"), `"\\n`);

  return s;
}

/* ========================= */

function renderSafeHtml(input) {
  // 1) on échappe tout
  let s = escapeHtml(input);

  // 2) whitelist
  s = s
    .replace(/&lt;(\/?)(b|strong|i|em|pre|code)&gt;/gi, "<$1$2>")
    .replace(/&lt;br\s*\/?&gt;/gi, "<br>");

  return s;
}

function renderLexique() {
  const sql = `
    SELECT
      t.id, t.terme, t.explication, t.exemple,
      c.id AS id_chapitre, c.titre AS chapitre, c.rang AS chap_rang,
      sc.id AS id_souschapitre, sc.titre AS souschapitre, sc.rang AS sc_rang,
      th.id AS id_theme, th.nom AS theme
    FROM TERMES t
    LEFT JOIN CHAPITRES c       ON t.id_chapitre = c.id
    LEFT JOIN SOUS_CHAPITRES sc ON t.id_souschapitre = sc.id
    LEFT JOIN THEMES th         ON th.id = c.id_theme
    LEFT JOIN LANGUES l         ON c.id_langue = l.id
    ORDER BY th.nom, chap_rang, sc_rang, t.rang;
  `;

  const res = db.exec(sql);
  if (!res.length) {
    document.getElementById("lexiqueContent").innerHTML = "<p>Aucune donnée trouvée.</p>";
    return;
  }

  const rows = res[0].values;
  const acc = document.getElementById("lexiqueContent");
  const toc = document.getElementById("toc");

  acc.innerHTML = "";
  toc.innerHTML = "";

  let currentThemeId = null;
  let currentChapId  = null;
  let currentScId    = null;

  rows.forEach(r => {
    const [
      id, terme, explication, exemple,
      idChap, chap, chapRang,
      idSc, souschap, scRang,
      idTheme, theme
    ] = r;

    if (idTheme !== null && idTheme !== currentThemeId) {
      currentThemeId = idTheme;
      currentChapId = null;
      currentScId = null;

      acc.innerHTML += `<h2 id="theme-${idTheme}"><i class="bi bi-journal-bookmark me-1"></i>${escapeHtml(theme)}</h2>`;
      toc.innerHTML += `<a class="list-group-item list-group-item-action" href="#theme-${idTheme}">${escapeHtml(theme)}</a>`;
    }

    if (idChap !== null && idChap !== currentChapId) {
      currentChapId = idChap;
      currentScId = null;
      acc.innerHTML += `<h3 id="chap-${idChap}"><i class="bi bi-bookmark me-1"></i>${escapeHtml(chap)}</h3>`;
    }

	const SHOW_SOUS_CHAPITRES = false;
	if (SHOW_SOUS_CHAPITRES && idSc !== null && idSc !== currentScId) {
	  currentScId = idSc;
	  acc.innerHTML += `<h4>${escapeHtml(souschap)}</h4>`;
	}

    const expHtml = renderSafeHtml(nlToBrExceptQuoted(explication));
    const exText  = normalizeCodeTextExceptQuoted(exemple);

    acc.innerHTML += `
      <div class="term">
        <div class="explication">${expHtml}</div>
        ${exemple ? `<pre class="exemple"><code>${escapeHtml(exText)}</code></pre>` : ""}
      </div>`;
  });
}

init();
</script>

  <!-- Gestion du clair/foncé -->
  <script src="../js/theme.js"></script>
  <script>
    Theme.init({ canWrite:false });
  </script>
</body>
</html>
